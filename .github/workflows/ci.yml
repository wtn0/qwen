# ===================================================
# CI Workflow — 持续集成
# 触发条件: push / pull_request 到 main 分支
# 流程: 代码检查 → 单元测试 → 构建
# ===================================================
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  # 允许手动触发
  workflow_dispatch:

# 并发控制：同一分支的新运行会取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: 代码质量检查（Lint + 类型检查）
  # ==========================================
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 npm registry
        run: echo "registry=https://registry.npmjs.org/" > .npmrc

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org/

      # 如果项目配置了 ESLint，取消下面注释
      # - name: ESLint 检查
      #   run: npm run lint

      # 如果项目使用 TypeScript，取消下面注释
      # - name: TypeScript 类型检查
      #   run: npx vue-tsc --noEmit

  # ==========================================
  # Job 2: 单元测试
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [] # 与 lint 并行执行，无需等待

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 npm registry
        run: echo "registry=https://registry.npmjs.org/" > .npmrc

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org/

      # 如果配置了 vitest 测试框架，取消下面注释
      # - name: 运行单元测试
      #   run: npm run test -- --coverage

      # - name: 上传覆盖率报告
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-report
      #     path: coverage/
      #     retention-days: 7

  # ==========================================
  # Job 3: 项目构建
  # ==========================================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test] # 等待 lint 和 test 都通过后才执行

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 配置 npm registry
        run: echo "registry=https://registry.npmjs.org/" > .npmrc

      - name: 安装依赖
        run: npm ci --registry=https://registry.npmjs.org/

      - name: 构建项目
        run: npm run build

      # 上传构建产物，供后续 Deploy Job 使用
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
